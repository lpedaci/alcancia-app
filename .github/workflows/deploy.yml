name: CI and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Real market values once a day (CLAUDE.md 5.6, D-264): 10:15 UTC, 07:15 in Argentina, after the BCRA publishes.
  schedule:
    - cron: '15 10 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Audit, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (lockfile only)
        run: npm ci

      # CLAUDE.md 8.2: the deploy fails on high or critical vulnerabilities.
      - name: Security audit
        run: npm audit --audit-level=high

      # D-200: what ships to visitors gets the strict bar, any known vulnerability fails.
      - name: Security audit of production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # D-264: the snapshot of real values (BCRA and INDEC) is written before the build, so it ships in
      # dist/market/. The published one is downloaded first: if a source fails today, its last valid
      # value is kept with its original date. The script never fails the build.
      - name: Previous market snapshot
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p public/market
          curl -fsS --max-time 20 https://lpedaci.github.io/alcancia-app/market/snapshot.json -o public/market/snapshot.json || rm -f public/market/snapshot.json

      - name: Real market values
        run: node scripts/fetch-market.mjs

      - name: Type check and build
        run: npm run build

      # CLAUDE.md 8.2: the published page must carry the Content Security Policy.
      - name: Check the Content Security Policy in the build
        run: grep -q 'http-equiv="Content-Security-Policy"' dist/index.html

      # D-200: every screen of the build runs under the CSP with no violation and no console error.
      - name: Install Chromium for the production checks
        run: npx playwright install --with-deps chromium

      - name: Check the production build under the CSP
        run: npx playwright test --config playwright.prod.config.ts

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
